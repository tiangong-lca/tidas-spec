name: spec

# Continuously proves the W1 candidate invariants on every change to the
# specification content, the build, or the publication contract:
#   * the shipped bytes are the reviewed bytes (import manifest + baseline);
#   * the file set, the lock, the language variants, and reference closure hold;
#   * the manifest and the archive are reproducible and agree with each other;
#   * the candidate archive reads and verifies on its own, with no sibling
#     repository and no dependency install from the archive.
#
# This workflow never publishes. An ordinary `main` commit must not create a
# package or a release; version preparation and channel publication are a
# separate reviewed step owned by W5.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the specification repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned exactly. The archive's bytes come from the platform zlib, so
          # reproducibility is guaranteed within one pinned toolchain; the drift
          # step below compares archive contents rather than bytes when the
          # runtime differs from the one recorded in the candidate receipt.
          node-version: '24.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Provision the pinned pnpm
        # The version is named here explicitly. Corepack's own pin would live in
        # `package.json`'s `packageManager` field, but the npm client strips that
        # field while packing, which would cost byte-identical channels. Naming it
        # in the workflow keeps the pin out of published metadata without leaving
        # the version unconstrained; `require-toolchain.mjs` below is what proves
        # the pin actually took effect.
        run: corepack prepare "pnpm@$(node -p "require('./toolchain.json').pnpm")" --activate

      - name: Require the pinned toolchain
        # Fails the job if `pnpm --version` or `node --version` is not what the
        # repository declares, so a runner's default toolchain cannot silently
        # stand in for the one the candidate was qualified against.
        run: node scripts/ci/require-toolchain.mjs

      - name: Install development dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check committed build output for drift
        # Runs before the build so a stale committed manifest or archive is
        # reported instead of being silently regenerated by the next step.
        run: node scripts/spec/build.mjs --check

      - name: Build the candidate
        run: node scripts/spec/build.mjs

      - name: Verify the candidate
        run: node scripts/spec/verify.mjs

      - name: Prove the build is reproducible
        run: |
          first="$(node scripts/spec/build.mjs --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).archiveSha256))')"
          second="$(node scripts/spec/build.mjs --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).archiveSha256))')"
          if [ "$first" != "$second" ]; then
            echo "archive digest is not reproducible: $first != $second" >&2
            exit 1
          fi
          echo "reproducible archive sha256: $first"

      - name: Run unit tests
        run: node --test 'test/unit/**/*.test.mjs'

      - name: Run conformance tests
        run: node --test 'test/conformance/**/*.test.mjs'

      - name: Run integration tests
        run: node --test 'test/integration/**/*.test.mjs'

      - name: Record candidate artifact digests
        if: always()
        run: |
          {
            echo "## W1 candidate artifacts"
            echo
            echo '```'
            shasum -a 256 release/*.tgz spec-manifest.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
